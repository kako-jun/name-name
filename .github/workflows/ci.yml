name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser:
    name: Parser & TUI (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # toolchain は repo 直下の rust-toolchain.toml が正本 (#732)。
      # ここで別バージョンを強制せず、ファイルの channel / targets / components をそのままインストールする
      - run: rustup toolchain install

      # rodio/cpal の Linux バックエンドが ALSA を使うため、alsa-sys のビルドに
      # libasound2-dev (alsa.pc) が必要。無いと pkg-config が alsa を見つけられず失敗する (#502)
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      # コミット済み wasm が rust-toolchain.toml の rustc でビルドされたかを、wasm に埋まる
      # `/rustc/<commit-hash>` で検査する (OS 非依存。wasm 自体の byte 一致は OS 間で取れないため見ない) (#732)
      - name: Committed wasm is built with the pinned rustc
        run: |
          hash=$(rustc -vV | sed -n 's/^commit-hash: //p')
          grep -aqF "/rustc/${hash}" parser/pkg/name_name_parser_bg.wasm

      # `--all` / `--workspace` を明示し、parser・tui 両クレートを対象にする
      # (working-directory を parser 単体に絞ると tui が素通りしてしまうため、
      # ワークスペース化 (#471) 以降はリポ直下から workspace 全体を対象に実行する)。
      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm test -- --run

  worker:
    name: Worker (Cloudflare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test
