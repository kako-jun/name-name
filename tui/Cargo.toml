[package]
name = "name-name-tui"
version = "0.1.0"
edition = "2021"
description = "TUI display client for name-name visual novel engine"

[dependencies]
name-name-parser = { path = "../parser" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# 自動クイックセーブ/ロード（#579）のセーブファイル形式。parser クレートは既に
# 依存している（parser/Cargo.toml）が、tui クレート単体では未使用だったため追加する。
serde_json = "1"
toml = "1"
anyhow = "1"
jiwa = "0.3"
# WebP のみ有効化（gymnasia のイベント絵アセットは WebP）。avif 等 default-formats の
# 重量級コーデックを引き込まないよう default-features は無効化する（#481）。
image = { version = "0.25", default-features = false, features = ["webp"] }
# cpal ベースの pure Rust オーディオ再生（#502）。docs/spec/markdown-v0.1.md の [BGM:]/[SE:]
# 構文例が .ogg（BGM）/.wav（SE）を使っているため、その2フォーマットの decoder のみ有効化する
# （symphonia 系や mp3/flac 等の重量級コーデックは対象外、image と同じ絞り込み方針）。
rodio = { version = "0.19", default-features = false, features = ["wav", "vorbis"] }
# ALSA/JACK が C レベルで直接 stderr へ書くログを、OutputStream::try_default() 呼び出し中だけ
# dup2 で /dev/null へ一時リダイレクトして抑制するために使う（#559）。
libc = "0.2"
# SE 複数候補プールのランダム抽出+シャッフル+ランダム間隔再生に使う (#672)。
rand = "0.8"
